  --bg: #f2f3f7;
  --surface: #ffffff;
  --surface2: #f7f7fb;
  --border: #e4e4ec;
  --accent: #c5007a;
  --accent-light: #fce8f3;
  --accent-dark: #9a005f;
  --teal: #00909a;

  --text: #18181f;
  --text-muted: #68687a;
  --text-dim: #a8a8bc;

  --radius-pill: 999px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}
.app {
  max-width: 900px;
  margin: 0 auto;
  padding: 32px 16px 52px;
}

/* HEADER */
header {
  display: flex;
  align-items: center;
  gap: 13px;
  margin-bottom: 28px;
}
.logo {
  width: 46px;
  height: 46px;
  background: linear-gradient(135deg, var(--accent) 0%, #8800aa 100%);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(197,0,122,0.3);

.header-text h1 {
  font-size: 21px;
  font-weight: 800;
  color: var(--text);
  letter-spacing: -0.5px;
}

  font-weight: 400;
}

/* SEARCH */
.search-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
}
.search-bar input {
  flex: 1;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-pill);
  padding: 11px 20px;
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
  box-shadow: var(--shadow-sm);
}
.search-bar input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(197,0,122,0.1);
}
.search-bar input::placeholder { color: var(--text-dim); }
.search-bar button {
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--radius-pill);
  padding: 11px 26px;
  font-family: 'DM Sans', sans-serif;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
  white-space: nowrap;
  box-shadow: 0 2px 8px rgba(197,0,122,0.25);
}
.search-bar button:hover { background: var(--accent-dark); box-shadow: 0 3px 12px rgba(197,0,122,0.35); }
.search-bar button:active { transform: scale(0.97); }
.search-bar button:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; }

/* SEARCH HINT */
#searchHint {
  display: none;
  margin: -4px 0 16px;
  padding: 10px 14px;
  background: var(--surface);

/* STATS GRID */

<script>
async function handleSearch() {
  const val = document.getElementById('pdgaInput').value.trim();
  if (!val) return;
  if (/^\d{4,7}$/.test(val)) {
    localStorage.setItem('disc_stats_last_pdga', val);
    document.getElementById('searchHint').style.display = 'none';
    loadPlayer();
    return;
  }
  await searchByName(val);
}

async function searchByName(name) {
  const btn = document.getElementById('searchBtn');
  btn.disabled = true;
  btn.textContent = 'Searching...';
  document.getElementById('searchHint').style.display = 'none';
  showLoading(`Searching for "${name}"...`);
  try {
    const parts = name.trim().split(/\s+/);

    // Build a list of (firstName, lastName) combos to try, from most to least specific.
    // e.g. "Karl Johan Bülow" → tries:
    //   1. FirstName="Karl Johan"  LastName="Bülow"   (all-but-last / last)
    //   2. FirstName="Karl"        LastName="Johan Bülow" (first / rest)
    //   3. FirstName=""            LastName="Karl Johan Bülow" (full as last name)
    const attempts = [];
    if (parts.length >= 2) {
      // Primary: everything except last word = first, last word = last
      attempts.push({ first: parts.slice(0, -1).join(' '), last: parts[parts.length - 1] });
      // Secondary: first word = first, rest = last (original behaviour)
      if (parts.length >= 3) {
        attempts.push({ first: parts[0], last: parts.slice(1).join(' ') });
      }
    }
    // Fallback: treat entire input as last name (catches single-name searches)
    attempts.push({ first: '', last: parts.join(' ') });

    let players = [];
    let usedFirst = parts[0], usedLast = parts.slice(1).join(' ');

    for (const attempt of attempts) {
      const searchUrl = `https://www.pdga.com/players?FirstName=${encodeURIComponent(attempt.first)}&LastName=${encodeURIComponent(attempt.last)}`;
      const html = await fetchViaProxy(searchUrl);
      const doc = new DOMParser().parseFromString(html, 'text/html');
      players = parsePlayerSearchResults(doc);
      usedFirst = attempt.first;
      usedLast = attempt.last;
      if (players.length) break; // found results — stop trying
    }

    document.getElementById('content').innerHTML = '<div class="status"><div style="font-size:36px;margin-bottom:14px;">🥏</div>Select a player below or enter a PDGA number</div>';
    if (!players.length) {
      document.getElementById('searchHint').style.display = 'flex';
      const link = document.getElementById('pdgaSearchLink');
      link.href = `https://www.pdga.com/players?FirstName=${encodeURIComponent(usedFirst)}&LastName=${encodeURIComponent(usedLast)}`;
      link.textContent = `Search "${name}" on PDGA.com →`;
    } else {
      showSearchResults(players);
    }
  } catch(e) {
    document.getElementById('content').innerHTML = '<div class="status"><div style="font-size:36px;margin-bottom:14px;">🥏</div>Enter your PDGA number to load your stats</div>';
    showSearchResults([], e.message);
  }
  btn.disabled = false;
  btn.textContent = 'Search';
}

function parsePlayerSearchResults(doc) {
  const players = [];
  const rows = doc.querySelectorAll('table tbody tr, .view-players tbody tr, .views-table tbody tr');
  rows.forEach(row => {
    const cells = Array.from(row.querySelectorAll('td'));
    if (cells.length < 2) return;
    let pdgaNum = '', name = '', location = '', rating = '', cls = '';
    const link = row.querySelector('a[href*="/player/"]');
    if (link) {
      const m = link.getAttribute('href').match(/\/player\/(\d+)/);
      if (m) pdgaNum = m[1];
      name = link.textContent.trim();
    }
    cells.forEach(td => {
      const t = td.textContent.trim();
      if (!pdgaNum && /^\d{4,7}$/.test(t)) pdgaNum = t;
      if (/^\d{3,4}$/.test(t) && +t > 400 && +t < 1100) rating = t;
    });
    cells.forEach(td => {
      const t = td.textContent.trim();
      if (t.includes(',') && t.length > 3 && t.length < 50 && !t.includes('/')) location = t;
    });
    if (pdgaNum && name) players.push({ pdgaNum, name, location, rating });
  });
  return players.slice(0, 8);
}

const PROXY_BASE = 'https://disc-stats.vercel.app/api/proxy';
async function fetchViaProxy(url, retries = 3) {
  const proxyUrl = `${PROXY_BASE}?url=${encodeURIComponent(url)}`;
  for (let i = 0; i < retries; i++) {
    try {
      const res = await fetch(proxyUrl, { signal: AbortSignal.timeout(12000) });
      if (res.status === 429) {
        await new Promise(r => setTimeout(r, 1500 * (i + 1)));
        continue;
      }
      if (!res.ok) throw new Error(`Proxy error ${res.status}`);
      const text = await res.text();
      if (!text || text.length < 100) throw new Error('Empty response from proxy');
      return text;
    } catch(e) {
      if (i === retries - 1) throw e;
      await new Promise(r => setTimeout(r, 800 * (i + 1)));
    }
  }
  throw new Error('Failed after retries');
}

async function fetchAllPages(baseUrl, type) {
  const events = [];
  let doc = null;
  const parser = new DOMParser();
  try {
    const html = await fetchViaProxy(baseUrl);
    doc = parser.parseFromString(html, 'text/html');
    parseEvents(doc, events, type);
    let maxPage = 0;
    doc.querySelectorAll('a[href*="page="]').forEach(a => {
      const m = (a.getAttribute('href')||'').match(/[?&]page=(\d+)/);
      if (m) maxPage = Math.max(maxPage, parseInt(m[1]));
    });
    for (let p = 1; p <= Math.min(maxPage, 15); p++) {
      try {
        const pageHtml = await fetchViaProxy(`${baseUrl}?page=${p}`);
        const pageDoc = parser.parseFromString(pageHtml, 'text/html');
        const before = events.length;
        parseEvents(pageDoc, events, type);
        if (events.length === before) break;
      } catch(e) { break; }
    }
  } catch(e) {
    if (type === 'tournament') throw e;
  }
  return { events, doc };
}

async function loadPlayer() {
  const num = document.getElementById('pdgaInput').value.trim();
  if (!num) return;
  const btn = document.getElementById('searchBtn');
  btn.disabled = true;
  btn.textContent = 'Loading...';
  showLoading('Fetching player profile...');
  try {
    const baseUrl = `https://www.pdga.com/player/${num}`;
    showLoading('Fetching player profile...');
    const { events: mainEvents, doc } = await fetchAllPages(baseUrl, 'tournament');
    if (!doc) throw new Error('Could not load profile page');
    const name = extractPlayerName(doc, num);
    const rating = extractRating(doc);
    const location = extractField(doc, ['.location','.views-field-city','.field-name-field-city']);
    const classification = extractField(doc, ['.classification','.views-field-class','.field-name-field-classification']);
    const memberStatus = extractField(doc, ['.membership-status','.views-field-membership-status']);
    const currentYear = new Date().getFullYear();
    const years = [];
    for (let y = currentYear; y >= 2010; y--) years.push(y);
    let allTournEvents = [...mainEvents];
    let allLeagueEvents = [];
    let allDoublesEvents = [];
    const sleep = ms => new Promise(r => setTimeout(r, ms));
    let emptyYearsTotal = 0;
    for (let i = 0; i < years.length; i += 3) {
      const batch = years.slice(i, i + 3);
      showLoading(`Fetching ${batch[batch.length-1]}–${batch[0]} results...`);
      const batchResults = await Promise.all(batch.map(year => Promise.all([
        fetchAllPages(`${baseUrl}/stats/${year}`, 'tournament').catch(() => ({ events: [] })),
        fetchAllPages(`${baseUrl}/stats/${year}?tab=leagues`, 'league').catch(() => ({ events: [] })),
        fetchAllPages(`${baseUrl}/stats/${year}?tab=doubles`, 'doubles').catch(() => ({ events: [] })),
      ])));
      let batchEmpty = 0;
      for (const [{ events: tEvents }, { events: lEvents }, { events: dEvents }] of batchResults) {
        const yearTotal = tEvents.length + lEvents.length + dEvents.length;
        if (yearTotal === 0) batchEmpty++;
        allTournEvents = [...allTournEvents, ...tEvents];
        allLeagueEvents = [...allLeagueEvents, ...lEvents];
        allDoublesEvents = [...allDoublesEvents, ...dEvents];
      }
      if (batchEmpty === batch.length) {
        emptyYearsTotal += batch.length;
        if (emptyYearsTotal >= 3) break;
      } else {
        emptyYearsTotal = 0;
      }
      await sleep(150);
    }
    const allEvents = dedup([...allTournEvents, ...allLeagueEvents, ...allDoublesEvents]);
    const counts = {
      tournament: allEvents.filter(e => e.type === 'tournament').length,
      league: allEvents.filter(e => e.type === 'league').length,
      doubles: allEvents.filter(e => e.type === 'doubles').length,
    };
    showLoading('Fetching rating history...');
    let ratingHistory = [], ratingsDetail = [];
    try {
      const histHtml = await fetchViaProxy(`${baseUrl}/history`);
      const histDoc = new DOMParser().parseFromString(histHtml, 'text/html');
      ratingHistory = parseRatingHistory(histDoc);
      ratingsDetail = parseRatingsDetail(histDoc);
    } catch(e) { /* silently skip */ }
    renderDashboard({ name, rating, pdgaNum: num, location, classification, memberStatus, events: allEvents, counts, ratingHistory, ratingsDetail });
  } catch(e) {
    console.error(e);
    showError(`Could not load player data. <a href="https://www.pdga.com/player/${num}" target="_blank" style="color:var(--accent);display:block;margin-top:8px;">Open PDGA profile directly →</a>`);
  }
  btn.disabled = false;
  btn.textContent = 'Search';
}

function parseRatingHistory(doc) {
  const entries = [];
  const MONTHS = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
  function parseDate(str) {
    const m1 = str.match(/^(\d{1,2})-([A-Za-z]{3})-(\d{4})$/);
    if (m1) { const mo = MONTHS[m1[2].toLowerCase()]; if (mo !== undefined) return new Date(+m1[3], mo, +m1[1]); }
    const m2 = str.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (m2) return new Date(+m2[1], +m2[2]-1, +m2[3]);
    const d = new Date(str);
    return isNaN(d) ? null : d;
  }
  const rows = doc.querySelectorAll('table tbody tr, .view-player-history tbody tr, .view-content table tbody tr');
  rows.forEach(row => {
    const cells = Array.from(row.querySelectorAll('td'));
    if (cells.length < 2) return;
    const texts = cells.map(c => c.textContent.trim());
    let rating = null, dateObj = null, label = texts[0];
    texts.forEach(t => {
      const rMatch = t.match(/^(\d{3,4})$/);
      if (rMatch && +rMatch[1] >= 400 && +rMatch[1] <= 1100) rating = +rMatch[1];
      if (!dateObj) dateObj = parseDate(t);
    });
    if (rating && dateObj) {
      entries.push({ date: dateObj.toISOString().split('T')[0], rating, label });
    }
  });
  entries.sort((a, b) => new Date(a.date) - new Date(b.date));
  return entries;
}

function parseRatingsDetail(doc) {
  const rounds = [];
  const MONTHS = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
  function parseAnyDate(str) {
    const m = str.match(/^(\d{1,2})-([A-Za-z]{3})-(\d{4})/);
    if (m) { const mo = MONTHS[m[2].toLowerCase()]; if (mo !== undefined) return new Date(+m[3], mo, +m[1]); }
    const d = new Date(str);
    return isNaN(d) ? null : d;
  }
  doc.querySelectorAll('table').forEach(table => {
    const headers = Array.from(table.querySelectorAll('th')).map(th => th.textContent.trim().toLowerCase());
    if (!headers.some(h => h.includes('round')) || !headers.some(h => h.includes('score'))) return;
    const colMap = {};
    headers.forEach((h, i) => {
      if (h.includes('tournament') || h.includes('event')) colMap.name = i;
      else if (h.includes('tier')) colMap.tier = i;
      else if (h.includes('date')) colMap.date = i;
      else if (h.includes('division') || h.includes('div')) colMap.division = i;
      else if (h.includes('round')) colMap.round = i;
      else if (h.includes('score')) colMap.score = i;
      else if (h.includes('rating')) colMap.rating = i;
    });
    table.querySelectorAll('tbody tr').forEach(row => {
      const cells = Array.from(row.querySelectorAll('td'));
      if (cells.length < 4) return;
      const get = (key) => colMap[key] !== undefined ? cells[colMap[key]]?.textContent.trim() : '';
      const name = get('name'), dateStr = get('date');
      if (!name || !dateStr) return;
      rounds.push({ name, tier: get('tier'), date: dateStr, division: get('division'), round: get('round'), score: get('score'), rating: get('rating') });
    });
  });
  return rounds;
}

function dedup(events) {
  const seen = new Set();
  return events.filter(e => {
    const key = e.name.toLowerCase().trim() + '__' + e.date;
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

function extractPlayerName(doc, num) {
  for (const sel of ['h1.page-title','.pane-page-title h1','h1#page-title','h1']) {
    const el = doc.querySelector(sel);
    if (el) {
      const t = el.textContent.trim().replace(/\s*#?\d{4,7}\s*$/, '').trim();
      if (t && t.length > 1 && !t.toLowerCase().includes('pdga')) return t;
    }
  }
  return `Player #${num}`;
}

function extractRating(doc) {
  for (const sel of ['.current-rating','.player-rating','[class*="current-rating"]','.views-field-rating']) {
    const el = doc.querySelector(sel);
    if (el) { const m = el.textContent.match(/\b(\d{3,4})\b/); if (m && +m[1]>100) return m[1]; }
  }
  const m = (doc.body?.textContent||'').match(/[Rr]ating[:\s]+(\d{3,4})/);
  return m ? m[1] : '—';
}

function extractField(doc, sels) {
  for (const s of sels) {
    try {
      const el = doc.querySelector(s);
      if (el) { const t = el.textContent.trim(); if (t && t.length < 80) return t; }
    } catch(e){}
  }
  return null;
}

function parseEvents(doc, arr, type) {
  let rows = [];
  for (const sel of ['table.views-table tbody tr','.view-player-results tbody tr','.view-id-player_results tbody tr','.view-content table tbody tr','table tbody tr']) {
    const found = doc.querySelectorAll(sel);
    if (found.length > 0) { rows = Array.from(found); break; }
  }
  if (!rows.length) {
    const divs = doc.querySelectorAll('.views-row');
    if (divs.length) rows = Array.from(divs);
  }
  rows.forEach(row => {
    const cells = Array.from(row.querySelectorAll('td, .views-field'));
    if (cells.length < 2) return;
    const texts = cells.map(c => c.textContent.trim());
    const rowText = texts.join(' ');
    if (/Totals?:/i.test(rowText) && texts.some(t => t.match(/Totals?:/i))) return;
    if (texts.some(t => /^(Event|Tournament|Name|Date|Place|Finish|Points)$/i.test(t) && cells.length < 4)) return;
    let name = '', link = '';
    for (const cell of cells) {
      const a = cell.querySelector('a');
      if (a) {
        const t = a.textContent.trim();
        if (t.length > 4 && !/^\d+$/.test(t) && !/^[A-Z]{1,4}$/.test(t)) {
          name = t;
          link = a.getAttribute('href') || '';
          if (link && !link.startsWith('http')) link = 'https://www.pdga.com' + link;
          break;
        }
      }
    }
    if (!name) {
      let longest = '';
      texts.forEach(t => { if (t.length > longest.length && !/^\d+$/.test(t) && t.length > 4 && !/^[A-Z]{1,4}$/.test(t)) longest = t; });
      name = longest;
    }
    if (!name || name.length < 4) return;
    if (/^[A-Z]{2,4}\d?\s*[·•]/.test(name)) return;
    if (/^(Am|Pro|Open|Mixed)\s+Totals?/i.test(name)) return;
    let date = '';
    texts.forEach(t => {
      if (!date) {
        const m = t.match(/\b\d{4}-\d{2}-\d{2}\b/) || t.match(/\b\d{1,2}-(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)-\d{4}\b/i) || t.match(/\b(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\w*\.?\s+\d{1,2},?\s+\d{4}\b/i) || t.match(/\b\d{1,2}\/\d{1,2}\/\d{2,4}\b/);
        if (m) date = m[0];
      }
    });
    let place = '—';
    for (let i = cells.length-1; i >= 0; i--) {
      const t = texts[i];
      if (/^T?\d+$/.test(t) && +t.replace('T','') > 0 && +t.replace('T','') < 2000) { place = t; break; }
      if (/^(DNF|DNS|DQ|WD|CUT)$/i.test(t)) { place = t.toUpperCase(); break; }
    }
    arr.push({ name, date, place, link, type });
  });
}

let activeFilter = 'all';

function filterEvents(type) {
  document.querySelectorAll('.type-tab').forEach(t => t.classList.toggle('active', t.dataset.type === type));
  const list = document.querySelector('.events-list');
  document.querySelectorAll('.event-row').forEach(r => {
    let hide = false;
    if (type === 'wins') hide = !['1','T1'].includes((r.dataset.place||'').replace(/^#/,''));
    else if (type === 'podiums') hide = !['1','2','3','T1','T2','T3'].includes((r.dataset.place||'').replace(/^#/,''));
    else if (type !== 'all') hide = r.dataset.type !== type;
    r.classList.toggle('hidden', hide);
  });
  if (list && (type === 'wins' || type === 'podiums')) {
    const rows = Array.from(list.querySelectorAll('.event-row'));
    const placeVal = r => { const n = parseInt(String(r.dataset.place||'').replace(/^#/,'').replace('T','')); return isNaN(n) ? 999 : n; };
    rows.sort((a, b) => placeVal(a) - placeVal(b));
    rows.forEach(r => list.appendChild(r));
  }
  const n = document.querySelectorAll('.event-row:not(.hidden)').length;
  const el = document.getElementById('vc');
  if (el) {
    const label = type === 'wins' ? 'Wins' : type === 'podiums' ? 'Podiums' : 'Events';
    el.textContent = n + ' ' + label;
  }
  activeFilter = type;
}

function setFilter(type) { filterEvents(type); }

function drawRatingChart(history) {
  const canvas = document.getElementById('ratingChart');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const wrap = canvas.parentElement;
  canvas.width = wrap.clientWidth;
  canvas.height = wrap.clientHeight;
  const W = canvas.width, H = canvas.height;
  const pad = { top: 32, right: 16, bottom: 16, left: 44 };
  const chartW = W - pad.left - pad.right;
  const chartH = H - pad.top - pad.bottom;
  const ratings = history.map(d => d.rating);
  const minR = Math.min(...ratings) - 20;
  const maxR = Math.max(...ratings) + 20;
  const rRange = maxR - minR;
  const toX = i => pad.left + (i / (history.length - 1)) * chartW;
  const toY = r => pad.top + chartH - ((r - minR) / rRange) * chartH;

  // Grid
  const step = rRange > 100 ? 50 : 25;
  for (let r = Math.ceil(minR / step) * step; r <= maxR; r += step) {
    const y = toY(r);
    ctx.beginPath();
    ctx.moveTo(pad.left, y);
    ctx.lineTo(pad.left + chartW, y);
    ctx.strokeStyle = 'rgba(180,180,200,0.5)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = '#a0a0b0';
    ctx.font = '10px DM Mono, monospace';
    ctx.textAlign = 'right';
    ctx.fillText(r, pad.left - 6, y + 3);
  }

  // Gradient fill
  const grad = ctx.createLinearGradient(0, pad.top, 0, pad.top + chartH);
  grad.addColorStop(0, 'rgba(0,144,154,0.18)');
  grad.addColorStop(1, 'rgba(0,144,154,0)');
  ctx.beginPath();
  history.forEach((d, i) => { i === 0 ? ctx.moveTo(toX(i), toY(d.rating)) : ctx.lineTo(toX(i), toY(d.rating)); });
  ctx.lineTo(toX(history.length - 1), pad.top + chartH);
  ctx.lineTo(toX(0), pad.top + chartH);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  // Line
  ctx.beginPath();
  history.forEach((d, i) => { i === 0 ? ctx.moveTo(toX(i), toY(d.rating)) : ctx.lineTo(toX(i), toY(d.rating)); });
  ctx.strokeStyle = '#00909a';
  ctx.lineWidth = 2.5;
  ctx.lineJoin = 'round';
  ctx.stroke();

  // Dots
  history.forEach((d, i) => {
    const x = toX(i), y = toY(d.rating);
    ctx.beginPath(); ctx.arc(x, y, 3.5, 0, Math.PI * 2); ctx.fillStyle = '#00909a'; ctx.fill();
    ctx.beginPath(); ctx.arc(x, y, 2, 0, Math.PI * 2); ctx.fillStyle = '#ffffff'; ctx.fill();
  });

  canvas._history = history;
  canvas._toX = toX;
  canvas._toY = toY;
  canvas._pad = pad;
  canvas._chartW = chartW;

  canvas.onmousemove = (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
    let closest = 0, minDist = Infinity;
    history.forEach((d, i) => { const dx = Math.abs(toX(i) - mx); if (dx < minDist) { minDist = dx; closest = i; } });
    const d = history[closest];
    const x = toX(closest), y = toY(d.rating);
    drawRatingChart(history);
    // Highlight
    ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI*2); ctx.fillStyle = '#00909a'; ctx.fill();
    ctx.beginPath(); ctx.arc(x, y, 2.5, 0, Math.PI*2); ctx.fillStyle = '#fff'; ctx.fill();
    // Tooltip
    const label = `${d.rating}  ·  ${d.label || d.date}`;
    ctx.font = '12px DM Mono, monospace';
    ctx.textBaseline = 'alphabetic';
    const tw = ctx.measureText(label).width;
    const pad2 = 12, boxW = tw + pad2 * 2, boxH = 28;
    let tx = x - boxW / 2;
    if (tx < 4) tx = 4;
    if (tx + boxW > W - 4) tx = W - boxW - 4;
    const showBelow = y < H / 2;
    const ty = showBelow ? y + 10 : y - boxH - 10;
    ctx.fillStyle = 'rgba(17,17,24,0.9)';
    ctx.beginPath(); ctx.roundRect(tx, ty, boxW, boxH, 6); ctx.fill();
    ctx.font = '12px DM Mono, monospace';
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = '#ffffff';
    ctx.fillText(label, tx + pad2, ty + 19);
  };
  canvas.onmouseleave = () => drawRatingChart(history);
}

function showLoading(msg) {
  document.getElementById('content').innerHTML = `<div class="status"><div class="spinner"></div>${msg}</div>`;
}
function showError(msg) {
  document.getElementById('content').innerHTML = `<div class="status error"><div style="font-size:28px;margin-bottom:12px;">⚠️</div>${msg}</div>`;
}

// ── NAV & PAGE SWITCHING ──────────────────────────────────
let currentPage = 'stats';

function toggleNav() {
  document.getElementById('navDropdown').classList.toggle('open');
}

// Close dropdown when clicking outside
document.addEventListener('click', e => {
  const menu = document.getElementById('navMenu');
  if (menu && !menu.contains(e.target)) {
    document.getElementById('navDropdown').classList.remove('open');
  }
});

function showPage(page) {
  document.getElementById('navDropdown').classList.remove('open');
  currentPage = page;
  const statsPage = document.getElementById('statsPage');
  const coursesPage = document.getElementById('coursesPage');
  const subtitle = document.getElementById('headerSubtitle');
  const navStats = document.getElementById('navStats');
  const navCourses = document.getElementById('navCourses');

  if (page === 'stats') {
    statsPage.classList.remove('hidden');
    coursesPage.classList.remove('active');
    subtitle.textContent = 'Work in Progress';
    navStats.classList.add('nav-item-active');
    navCourses.classList.remove('nav-item-active');
  } else {
    statsPage.classList.add('hidden');
    coursesPage.classList.add('active');
    subtitle.textContent = 'Course Finder';
    navStats.classList.remove('nav-item-active');
    navCourses.classList.add('nav-item-active');
    initCoursesPage();
  }
}

// ── COURSES (OpenStreetMap / Overpass API) ─────────────────

function initCoursesPage() {
  // Nothing needed — just show the default prompt state
}

async function searchNearMe() {
  const btn = document.getElementById('nearMeBtn');
  btn.disabled = true;
  btn.textContent = '📍 Locating...';
  navigator.geolocation.getCurrentPosition(
    pos => {
      btn.disabled = false;
      btn.textContent = '📍 Near me';
      searchCoursesByCoords(pos.coords.latitude, pos.coords.longitude, 'your location');
    },
    () => {
      btn.disabled = false;
      btn.textContent = '📍 Near me';
      showCoursesError('Could not get your location. Try searching by city name instead.');
    }
  );
}

async function searchCoursesText() {
  const q = document.getElementById('courseSearchInput').value.trim();
  if (!q) return;
  showCoursesLoading(`Finding "${q}"...`);
  try {
    // Geocode via Nominatim (OSM geocoder, free)
    const geoUrl = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=1`;
    const geoRes = await fetch(geoUrl, { headers: { 'Accept-Language': 'en' } });
    const geoData = await geoRes.json();
    if (!geoData.length) { showCoursesError('Location not found. Try a different city or place name.'); return; }
    const lat = parseFloat(geoData[0].lat);
    const lng = parseFloat(geoData[0].lon);
    await searchCoursesByCoords(lat, lng, q);
  } catch(e) {
    showCoursesError('Search failed. Please try again.');
  }
}

async function searchCoursesByCoords(lat, lng, label) {
  showCoursesLoading(`Finding disc golf courses near ${label}...`);
  try {
    // Overpass query: leisure=disc_golf_course within 25km radius
    const radius = 25000;
    const query = `
      [out:json][timeout:25];
      (
        node["leisure"="disc_golf_course"](around:${radius},${lat},${lng});
        way["leisure"="disc_golf_course"](around:${radius},${lat},${lng});
        relation["leisure"="disc_golf_course"](around:${radius},${lat},${lng});
        node["sport"="disc_golf"](around:${radius},${lat},${lng});
        way["sport"="disc_golf"](around:${radius},${lat},${lng});
      );
      out center;
    `;
    const overpassUrl = 'https://overpass-api.de/api/interpreter';
    const res = await fetch(overpassUrl, {
      method: 'POST',
      body: 'data=' + encodeURIComponent(query)
    });
    const data = await res.json();
    renderCourses(data.elements || [], lat, lng, label);
  } catch(e) {
    showCoursesError('Could not load courses. The OpenStreetMap service may be busy — please try again.');
  }
}

function renderCourses(elements, userLat, userLng, label) {
  // Deduplicate by name + approximate location
  const seen = new Set();
  const unique = elements.filter(el => {
    const elLat = el.lat || el.center?.lat;
    const elLng = el.lon || el.center?.lon;
    if (!elLat || !elLng) return false;
    const key = (el.tags?.name || 'unnamed') + '_' + Math.round(elLat*100) + '_' + Math.round(elLng*100);
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });

  if (!unique.length) {
    document.getElementById('coursesContent').innerHTML = `
      <div class="status">
        <div style="font-size:36px;margin-bottom:12px;">🥏</div>
        No disc golf courses found within 25km of ${label}.<br>
        <small style="color:var(--text-dim);margin-top:6px;display:block;">Try a different location or expand your search.</small>
      </div>`;
    return;
  }

  function distKm(lat1, lng1, lat2, lng2) {
    const R = 6371, dLat = (lat2-lat1)*Math.PI/180, dLng = (lng2-lng1)*Math.PI/180;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  const withDist = unique.map(el => {
    const elLat = el.lat || el.center?.lat;
    const elLng = el.lon || el.center?.lon;
    return { ...el, elLat, elLng, distKm: distKm(userLat, userLng, elLat, elLng) };
  }).sort((a, b) => a.distKm - b.distKm);

  let h = `<div style="font-size:11px;font-weight:700;letter-spacing:0.6px;text-transform:uppercase;color:var(--text-muted);padding:0 2px 12px;">${withDist.length} course${withDist.length !== 1 ? 's' : ''} found near ${label}</div>`;

  withDist.forEach(el => {
    const tags = el.tags || {};
    const name = tags.name || 'Unnamed Course';
    const holes = tags.holes ? tags.holes + ' holes' : '';
    const surface = tags.surface || '';
    const operator = tags.operator || tags['addr:city'] || tags.city || '';
    const meta = [holes, operator].filter(Boolean).join(' · ') || 'Disc golf course';
    const dist = el.distKm < 1 ? Math.round(el.distKm * 1000) + 'm' : el.distKm.toFixed(1) + 'km';
    const mapsUrl = `https://www.openstreetmap.org/?mlat=${el.elLat}&mlon=${el.elLng}&zoom=16`;

    h += `<a class="course-card" href="${mapsUrl}" target="_blank">
      <div class="course-icon">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
          <circle cx="11" cy="11" r="9.5" stroke="currentColor" stroke-width="1.8"/>
          <circle cx="11" cy="11" r="5" stroke="currentColor" stroke-width="1.5"/>
          <circle cx="11" cy="11" r="1.8" fill="currentColor"/>
        </svg>
      </div>
      <div class="course-info">
        <div class="course-name">${name}</div>
        <div class="course-meta">${meta}</div>
      </div>
      <div class="course-rating">
        <div class="course-distance">${dist}</div>
      </div>
    </a>`;
  });

  document.getElementById('coursesContent').innerHTML = h;
}

function showCoursesLoading(msg) {
  document.getElementById('coursesContent').innerHTML = `<div class="status"><div class="spinner"></div>${msg}</div>`;
}
function showCoursesError(msg) {
  document.getElementById('coursesContent').innerHTML = `<div class="status error"><div style="font-size:28px;margin-bottom:10px;">⚠️</div>${msg}</div>`;
}

document.getElementById('courseSearchInput')?.addEventListener('keydown', e => { if(e.key==='Enter') searchCoursesText(); });

document.getElementById('pdgaInput').addEventListener('keydown', e => { if(e.key==='Enter') handleSearch(); });
window.addEventListener('load', () => {
  const last = localStorage.getItem('disc_stats_last_pdga');
  if (last) document.getElementById('pdgaInput').value = last;

  // Register service worker for PWA
  if ('serviceWorker' in navigator) {
    const swCode = `
      const CACHE = 'disc-stats-v1';
      self.addEventListener('install', e => {
        e.waitUntil(caches.open(CACHE).then(c => c.addAll(['/'])));
      });
      self.addEventListener('fetch', e => {
        e.respondWith(
          fetch(e.request).catch(() => caches.match(e.request))
        );
      });
    `;
    const blob = new Blob([swCode], { type: 'application/javascript' });
    const swUrl = URL.createObjectURL(blob);
    navigator.serviceWorker.register(swUrl, { scope: '/' }).catch(() => {});
  }
});
</script>
