<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compare Players – Disc Golf Overview</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Disc Golf Overview">
<meta name="theme-color" content="#c5007a">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f2f3f7;
  --surface: #ffffff;
  --surface2: #f7f7fb;
  --border: #e4e4ec;
  --accent: #c5007a;
  --accent-light: #fce8f3;
  --accent-dark: #9a005f;
  --teal: #00909a;
  --teal-light: #e0f5f7;
  --text: #18181f;
  --text-muted: #68687a;
  --text-dim: #a8a8bc;
  --gold: #a06800;
  --gold-bg: #fff7e0;
  --gold-border: #ecd060;
  --green: #00784a;
  --green-bg: #e2f5ec;
  --green-border: #90d4b4;
  --orange: #b84800;
  --orange-light: #fff0e4;
  --shadow-sm: 0 1px 3px rgba(20,20,40,0.07);
  --shadow: 0 3px 14px rgba(20,20,40,0.09), 0 1px 3px rgba(20,20,40,0.05);
  --radius: 14px;
  --radius-sm: 10px;
  --radius-pill: 999px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
.app {
  max-width: 620px;
  margin: 0 auto;
  padding: 0 16px 40px;
}

/* HEADER */
header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 18px 0 16px;
  position: relative;
}
.logo img {
  display: block;
  border-radius: 12px;
}
.header-text h1 {
  font-size: 17px;
  font-weight: 800;
  letter-spacing: -0.3px;
  color: var(--text);
}
.header-text p {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 1px;
  font-weight: 500;
}

/* NAV MENU */
.nav-menu {
  margin-left: auto;
  position: relative;
}
.nav-trigger {
  display: flex;
  align-items: center;
  gap: 7px;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-pill);
  padding: 8px 14px;
  font-family: "DM Sans", sans-serif;
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
  cursor: pointer;
  transition: border-color 0.15s, box-shadow 0.15s;
  box-shadow: var(--shadow-sm);
  white-space: nowrap;
}
.nav-trigger:hover {
  border-color: var(--accent);
  color: var(--accent);
}
.nav-dropdown {
  display: none;
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  min-width: 180px;
  z-index: 100;
  overflow: hidden;
}
.nav-dropdown.open { display: block; }
.nav-item {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 12px 16px;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--text-muted);
  cursor: pointer;
  transition: background 0.12s, color 0.12s;
  border-bottom: 1px solid var(--border);
  text-decoration: none;
}
.nav-item:last-child { border-bottom: none; }
.nav-item:hover { background: var(--surface2); color: var(--text); }
.nav-item.nav-item-active { color: var(--accent); }
.nav-item.nav-item-active svg { color: var(--accent); }

/* COMPARE SEARCH */
.compare-search {
  margin-bottom: 20px;
}
.compare-inputs {
  display: flex;
  gap: 8px;
  margin-bottom: 8px;
}
.compare-inputs input {
  flex: 1;
  min-width: 0;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-pill);
  padding: 11px 18px;
  color: var(--text);
  font-family: "DM Sans", sans-serif;
  font-size: 15px;
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
  box-shadow: var(--shadow-sm);
}
.compare-inputs input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(197,0,122,0.1);
}
.compare-inputs input::placeholder { color: var(--text-dim); }
.compare-btn {
  width: 100%;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--radius-pill);
  padding: 11px 20px;
  font-family: "DM Sans", sans-serif;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  transition: background 0.15s, box-shadow 0.15s;
  box-shadow: 0 2px 8px rgba(197,0,122,0.25);
  letter-spacing: 0.1px;
}
.compare-btn:hover { background: var(--accent-dark); box-shadow: 0 3px 12px rgba(197,0,122,0.35); }
.compare-btn:disabled { opacity: 0.45; cursor: not-allowed; }

/* STATUS / SPINNER */
.status {
  text-align: center;
  padding: 48px 20px;
  color: var(--text-muted);
  font-size: 14px;
  line-height: 1.6;
}
.status.error { color: var(--orange); }
.spinner {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 2.5px solid var(--border);
  border-top-color: var(--accent);
  animation: spin 0.75s linear infinite;
  margin: 0 auto 14px;
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.fade-in { animation: fadeIn 0.25s ease-out; }

/* SECTION */
.section {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 14px;
  box-shadow: var(--shadow-sm);
}
.section-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 13px 16px;
  border-bottom: 1px solid var(--border);
}
.section-header h3 {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.7px;
  text-transform: uppercase;
  color: var(--text-muted);
}
.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent);
  flex-shrink: 0;
}

/* CHART */
.chart-wrap {
  position: relative;
  padding: 16px 16px 12px;
}
.chart-canvas-wrap {
  position: relative;
  width: 100%;
  height: 200px;
}
canvas { display: block; }
.chart-empty {
  padding: 28px 16px;
  text-align: center;
  font-size: 13px;
  color: var(--text-dim);
}
.chart-legend {
  display: flex;
  gap: 16px;
  padding: 0 4px 4px;
  flex-wrap: wrap;
}
.chart-legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
}
.chart-legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}

/* HEAD-TO-HEAD GRID */
.h2h-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0;
}
.h2h-player-header {
  padding: 14px 16px 10px;
  border-bottom: 1px solid var(--border);
}
.h2h-player-header:first-child {
  border-right: 1px solid var(--border);
}
.h2h-player-name {
  font-size: 14px;
  font-weight: 800;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 2px;
}
.h2h-player-num {
  font-size: 11px;
  font-family: 'DM Mono', monospace;
  color: var(--text-dim);
}
.h2h-player-header.p1 .h2h-player-name { color: var(--accent); }
.h2h-player-header.p2 .h2h-player-name { color: var(--teal); }

.h2h-stat-row {
  display: contents;
}
.h2h-cell {
  padding: 11px 16px;
  border-bottom: 1px solid var(--border);
}
.h2h-cell:nth-child(odd) {
  border-right: 1px solid var(--border);
}
.h2h-cell:nth-last-child(-n+2) {
  border-bottom: none;
}
.h2h-stat-value {
  font-size: 22px;
  font-weight: 800;
  font-family: 'DM Mono', monospace;
  color: var(--text);
  letter-spacing: -0.5px;
}
.h2h-stat-label {
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 600;
  margin-top: 2px;
  text-transform: uppercase;
  letter-spacing: 0.4px;
}
.h2h-cell.winner .h2h-stat-value { color: var(--accent); }
.h2h-cell.winner-teal .h2h-stat-value { color: var(--teal); }

/* SHARED EVENTS */
.shared-events-table {
  width: 100%;
}
.shared-event-row {
  display: grid;
  grid-template-columns: 1fr auto auto;
  gap: 8px;
  align-items: center;
  padding: 9px 16px;
  border-bottom: 1px solid var(--border);
  transition: background 0.1s;
}
.shared-event-row:last-child { border-bottom: none; }
.shared-event-row:hover { background: var(--surface2); }
.shared-event-name {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.shared-event-name a {
  color: inherit;
  text-decoration: none;
}
.shared-event-name a:hover { color: var(--accent); text-decoration: underline; }
.shared-event-year {
  font-size: 11px;
  color: var(--text-dim);
  font-family: 'DM Mono', monospace;
  margin-top: 2px;
}
.shared-placements {
  display: flex;
  gap: 6px;
  align-items: center;
  flex-shrink: 0;
}
.placement-badge {
  font-size: 11px;
  font-weight: 700;
  font-family: 'DM Mono', monospace;
  padding: 3px 8px;
  border-radius: var(--radius-pill);
  min-width: 36px;
  text-align: center;
}
.placement-badge.p1 {
  background: var(--accent-light);
  color: var(--accent);
}
.placement-badge.p2 {
  background: var(--teal-light);
  color: var(--teal);
}
.placement-badge.place-1 {
  background: var(--gold-bg);
  color: var(--gold);
  border: 1px solid var(--gold-border);
}
.shared-events-header {
  display: grid;
  grid-template-columns: 1fr auto auto;
  gap: 8px;
  padding: 8px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--surface2);
}
.shared-events-header span {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-dim);
  text-align: center;
}
.shared-events-header span:first-child { text-align: left; }
.shared-count {
  margin-left: auto;
  font-size: 12px;
  color: var(--text-muted);
  font-family: 'DM Mono', monospace;
}
.empty-shared {
  padding: 28px 16px;
  text-align: center;
  font-size: 13px;
  color: var(--text-dim);
}

/* PDGA CREDIT */
.pdga-credit {
  text-align: center;
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 20px;
}
.pdga-credit a { color: var(--text-muted); text-decoration: none; }
.pdga-credit a:hover { color: var(--accent); }

@media (max-width: 480px) {
  .compare-inputs { flex-direction: column; }
  .compare-inputs input { font-size: 16px; }
  .h2h-stat-value { font-size: 19px; }
}
</style>
</head>

<script>
// ── PROXY & FETCH UTILITIES ───────────────────────────────
const PROXY_BASE = 'https://disc-stats.vercel.app/api/proxy';

async function fetchViaProxy(url, retries = 3) {
  const proxyUrl = `${PROXY_BASE}?url=${encodeURIComponent(url)}`;
  for (let i = 0; i < retries; i++) {
    try {
      const res = await fetch(proxyUrl, { signal: AbortSignal.timeout(12000) });
      if (res.status === 429) { await sleep(1500 * (i + 1)); continue; }
      if (!res.ok) throw new Error(`Proxy error ${res.status}`);
      const text = await res.text();
      if (!text || text.length < 100) throw new Error('Empty response');
      return text;
    } catch(e) {
      if (i === retries - 1) throw e;
      await sleep(800 * (i + 1));
    }
  }
  throw new Error('Failed after retries');
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

async function fetchAllPages(baseUrl, type) {
  const events = [];
  const parser = new DOMParser();
  let doc = null;
  try {
    const html = await fetchViaProxy(baseUrl);
    doc = parser.parseFromString(html, 'text/html');
    parseEvents(doc, events, type);
    let maxPage = 0;
    doc.querySelectorAll('a[href*="page="]').forEach(a => {
      const m = (a.getAttribute('href') || '').match(/[?&]page=(\d+)/);
      if (m) maxPage = Math.max(maxPage, parseInt(m[1]));
    });
    for (let p = 1; p <= Math.min(maxPage, 15); p++) {
      try {
        const ph = await fetchViaProxy(`${baseUrl}?page=${p}`);
        const pd = parser.parseFromString(ph, 'text/html');
        const before = events.length;
        parseEvents(pd, events, type);
        if (events.length === before) break;
      } catch(e) { break; }
    }
  } catch(e) {
    if (type === 'tournament') throw e;
  }
  return { events, doc };
}

function parseEvents(doc, arr, type) {
  let rows = [];
  for (const sel of ['table.views-table tbody tr','.view-player-results tbody tr','.view-id-player_results tbody tr','.view-content table tbody tr','table tbody tr']) {
    const found = doc.querySelectorAll(sel);
    if (found.length > 0) { rows = Array.from(found); break; }
  }
  if (!rows.length) {
    const divs = doc.querySelectorAll('.views-row');
    if (divs.length) rows = Array.from(divs);
  }
  rows.forEach(row => {
    const cells = Array.from(row.querySelectorAll('td, .views-field'));
    if (cells.length < 2) return;
    const texts = cells.map(c => c.textContent.trim());
    const rowText = texts.join(' ');
    if (/Totals?:/i.test(rowText) && texts.some(t => t.match(/Totals?:/i))) return;
    if (texts.some(t => /^(Event|Tournament|Name|Date|Place|Finish|Points)$/i.test(t) && cells.length < 4)) return;
    let name = '', link = '';
    for (const cell of cells) {
      const a = cell.querySelector('a');
      if (a) {
        const t = a.textContent.trim();
        if (t.length > 4 && !/^\d+$/.test(t) && !/^[A-Z]{1,4}$/.test(t)) {
          name = t; link = a.getAttribute('href') || '';
          if (link && !link.startsWith('http')) link = 'https://www.pdga.com' + link;
          break;
        }
      }
    }
    if (!name) {
      let longest = '';
      texts.forEach(t => { if (t.length > longest.length && !/^\d+$/.test(t) && t.length > 4 && !/^[A-Z]{1,4}$/.test(t)) longest = t; });
      name = longest;
    }
    if (!name || name.length < 4) return;
    if (/^[A-Z]{2,4}\d?\s*[·•]/.test(name)) return;
    if (/^(Am|Pro|Open|Mixed)\s+Totals?/i.test(name)) return;
    let date = '';
    texts.forEach(t => {
      if (!date) {
        const m = t.match(/\b\d{4}-\d{2}-\d{2}\b/) || t.match(/\b\d{1,2}-(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)-\d{4}\b/i) || t.match(/\b(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\w*\.?\s+\d{1,2},?\s+\d{4}\b/i) || t.match(/\b\d{1,2}\/\d{1,2}\/\d{2,4}\b/);
        if (m) date = m[0];
      }
    });
    let place = '—';
    for (let i = cells.length - 1; i >= 0; i--) {
      const t = texts[i];
      if (/^T?\d+$/.test(t) && +t.replace('T','') > 0 && +t.replace('T','') < 2000) { place = t; break; }
      if (/^(DNF|DNS|DQ|WD|CUT)$/i.test(t)) { place = t.toUpperCase(); break; }
    }
    arr.push({ name, date, place, link, type });
  });
}

function dedup(events) {
  const seen = new Set();
  return events.filter(e => {
    const key = e.name.toLowerCase().trim() + '__' + e.date;
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

function extractPlayerName(doc, num) {
  for (const sel of ['h1.page-title','.pane-page-title h1','h1#page-title','h1']) {
    const el = doc.querySelector(sel);
    if (el) {
      const t = el.textContent.trim().replace(/\s*#?\d{4,7}\s*$/, '').trim();
      if (t && t.length > 1 && !t.toLowerCase().includes('pdga')) return t;
    }
  }
  return `Player #${num}`;
}

function extractRating(doc) {
  for (const sel of ['.current-rating','.player-rating','[class*="current-rating"]','.views-field-rating']) {
    const el = doc.querySelector(sel);
    if (el) { const m = el.textContent.match(/\b(\d{3,4})\b/); if (m && +m[1] > 100) return m[1]; }
  }
  const m = (doc.body?.textContent || '').match(/[Rr]ating[:\s]+(\d{3,4})/);
  return m ? m[1] : '—';
}

function parseRatingHistory(doc) {
  const entries = [];
  const MONTHS = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
  function parseDate(str) {
    const m1 = str.match(/^(\d{1,2})-([A-Za-z]{3})-(\d{4})$/);
    if (m1) { const mo = MONTHS[m1[2].toLowerCase()]; if (mo !== undefined) return new Date(+m1[3], mo, +m1[1]); }
    const m2 = str.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (m2) return new Date(+m2[1], +m2[2]-1, +m2[3]);
    const d = new Date(str);
    return isNaN(d) ? null : d;
  }
  const rows = doc.querySelectorAll('table tbody tr, .view-player-history tbody tr, .view-content table tbody tr');
  rows.forEach(row => {
    const cells = Array.from(row.querySelectorAll('td'));
    if (cells.length < 2) return;
    const texts = cells.map(c => c.textContent.trim());
    let rating = null, dateObj = null;
    texts.forEach(t => {
      const rMatch = t.match(/^(\d{3,4})$/);
      if (rMatch && +rMatch[1] >= 400 && +rMatch[1] <= 1100) rating = +rMatch[1];
      if (!dateObj) dateObj = parseDate(t);
    });
    if (rating && dateObj) entries.push({ date: dateObj.toISOString().split('T')[0], rating });
  });
  entries.sort((a, b) => new Date(a.date) - new Date(b.date));
  return entries;
}

// ── LOAD PLAYER DATA ──────────────────────────────────────
async function loadPlayerData(num, onProgress) {
  const baseUrl = `https://www.pdga.com/player/${num}`;
  onProgress('Fetching profile...');
  const { events: mainEvents, doc } = await fetchAllPages(baseUrl, 'tournament');
  if (!doc) throw new Error('Could not load profile');
  const name = extractPlayerName(doc, num);
  const rating = extractRating(doc);

  const currentYear = new Date().getFullYear();
  const years = [];
  for (let y = currentYear; y >= 2010; y--) years.push(y);
  let allTournEvents = [...mainEvents];
  let allLeagueEvents = [], allDoublesEvents = [];
  let emptyYearsTotal = 0;

  for (let i = 0; i < years.length; i += 3) {
    const batch = years.slice(i, i + 3);
    onProgress(`Fetching ${batch[batch.length-1]}–${batch[0]} results...`);
    const batchResults = await Promise.all(batch.map(year => Promise.all([
      fetchAllPages(`${baseUrl}/stats/${year}`, 'tournament').catch(() => ({ events: [] })),
      fetchAllPages(`${baseUrl}/stats/${year}?tab=leagues`, 'league').catch(() => ({ events: [] })),
      fetchAllPages(`${baseUrl}/stats/${year}?tab=doubles`, 'doubles').catch(() => ({ events: [] })),
    ])));
    let batchEmpty = 0;
    for (const [{ events: tE }, { events: lE }, { events: dE }] of batchResults) {
      if (tE.length + lE.length + dE.length === 0) batchEmpty++;
      allTournEvents = [...allTournEvents, ...tE];
      allLeagueEvents = [...allLeagueEvents, ...lE];
      allDoublesEvents = [...allDoublesEvents, ...dE];
    }
    if (batchEmpty === batch.length) {
      emptyYearsTotal += batch.length;
      if (emptyYearsTotal >= 3) break;
    } else { emptyYearsTotal = 0; }
    await sleep(150);
  }

  const allEvents = dedup([...allTournEvents, ...allLeagueEvents, ...allDoublesEvents]);

  onProgress('Fetching rating history...');
  let ratingHistory = [];
  try {
    const histHtml = await fetchViaProxy(`${baseUrl}/history`);
    const histDoc = new DOMParser().parseFromString(histHtml, 'text/html');
    ratingHistory = parseRatingHistory(histDoc);
  } catch(e) {}

  return { name, rating, pdgaNum: num, events: allEvents, ratingHistory };
}

// ── MAIN COMPARE HANDLER ──────────────────────────────────
async function handleCompare() {
  const n1 = document.getElementById('p1Input').value.trim();
  const n2 = document.getElementById('p2Input').value.trim();
  if (!n1 || !n2) { alert('Please enter both PDGA numbers.'); return; }
  if (!/^\d{4,7}$/.test(n1) || !/^\d{4,7}$/.test(n2)) { alert('Please enter valid PDGA numbers (4–7 digits).'); return; }
  if (n1 === n2) { alert('Please enter two different PDGA numbers.'); return; }

  const btn = document.getElementById('compareBtn');
  btn.disabled = true;
  btn.textContent = 'Loading…';

  const results = document.getElementById('compareResults');
  results.innerHTML = `<div class="status"><div class="spinner"></div>Loading Player 1…</div>`;

  try {
    const [p1, p2] = await Promise.all([
      loadPlayerData(n1, msg => { results.innerHTML = `<div class="status"><div class="spinner"></div>${msg} (Player 1)</div>`; }),
      loadPlayerData(n2, msg => {}),
    ]);
    renderCompare(p1, p2);
  } catch(e) {
    results.innerHTML = `<div class="status error"><div style="font-size:28px;margin-bottom:12px;">⚠️</div>Could not load player data. Check the PDGA numbers and try again.</div>`;
  }

  btn.disabled = false;
  btn.textContent = 'Compare';
}

// ── RENDER COMPARE RESULTS ────────────────────────────────
function renderCompare(p1, p2) {
  const normPlace = p => String(p || '').replace(/^#/, '').trim();
  const isWin = e => ['1','T1'].includes(normPlace(e.place));
  const isPodium = e => ['1','2','3','T1','T2','T3'].includes(normPlace(e.place));

  const stats1 = {
    events: p1.events.length,
    wins: p1.events.filter(isWin).length,
    podiums: p1.events.filter(isPodium).length,
    rating: p1.rating,
  };
  const stats2 = {
    events: p2.events.length,
    wins: p2.events.filter(isWin).length,
    podiums: p2.events.filter(isPodium).length,
    rating: p2.rating,
  };

  const sharedEvents = findSharedEvents(p1.events, p2.events);
  const hasChart = p1.ratingHistory.length >= 2 || p2.ratingHistory.length >= 2;

  let h = `<div class="fade-in">`;

  // ── RATING HISTORY CHART ──
  h += `<div class="section">
    <div class="section-header"><div class="dot"></div><h3>Rating History</h3></div>`;
  if (hasChart) {
    h += `<div class="chart-wrap">
      <div class="chart-canvas-wrap"><canvas id="compareChart"></canvas></div>
      <div class="chart-legend" id="chartLegend"></div>
    </div>`;
  } else {
    h += `<div class="chart-empty">No rating history data available for these players.</div>`;
  }
  h += `</div>`;

  // ── HEAD-TO-HEAD STATS ──
  const statRows = [
    { label: 'Total Events', k: 'events', higher: true },
    { label: 'Wins',         k: 'wins',   higher: true },
    { label: 'Podiums',      k: 'podiums',higher: true },
    { label: 'Rating',       k: 'rating', higher: true },
  ];

  h += `<div class="section">
    <div class="section-header"><div class="dot"></div><h3>Head-to-Head</h3></div>
    <div class="h2h-grid">
      <div class="h2h-player-header p1">
        <div class="h2h-player-name">${escHtml(p1.name)}</div>
        <div class="h2h-player-num">#${p1.pdgaNum}</div>
      </div>
      <div class="h2h-player-header p2">
        <div class="h2h-player-name">${escHtml(p2.name)}</div>
        <div class="h2h-player-num">#${p2.pdgaNum}</div>
      </div>`;

  for (const { label, k, higher } of statRows) {
    const v1 = stats1[k], v2 = stats2[k];
    const n1 = parseFloat(v1) || 0, n2 = parseFloat(v2) || 0;
    const p1wins = higher ? n1 > n2 : n1 < n2;
    const p2wins = higher ? n2 > n1 : n2 < n1;
    h += `<div class="h2h-cell${p1wins ? ' winner' : ''}">
        <div class="h2h-stat-value">${v1}</div>
        <div class="h2h-stat-label">${label}</div>
      </div>
      <div class="h2h-cell${p2wins ? ' winner-teal' : ''}">
        <div class="h2h-stat-value">${v2}</div>
        <div class="h2h-stat-label">${label}</div>
      </div>`;
  }
  h += `</div></div>`;

  // ── SHARED EVENTS ──
  h += `<div class="section">
    <div class="section-header">
      <div class="dot"></div><h3>Shared Events</h3>
      <span class="shared-count">${sharedEvents.length} event${sharedEvents.length !== 1 ? 's' : ''}</span>
    </div>`;

  if (sharedEvents.length === 0) {
    h += `<div class="empty-shared">No shared events found between these two players.</div>`;
  } else {
    h += `<div class="shared-events-table">
      <div class="shared-events-header">
        <span>Event</span>
        <span style="color:var(--accent);">#${p1.pdgaNum}</span>
        <span style="color:var(--teal);">#${p2.pdgaNum}</span>
      </div>`;
    sharedEvents.forEach(ev => {
      const yearStr = ev.date ? (ev.date.match(/(\d{4})/) || ['',''])[1] : '';
      const nm = ev.link ? `<a href="${ev.link}" target="_blank">${escHtml(ev.name)}</a>` : escHtml(ev.name);
      const dp1 = fmtPlace(ev.place1);
      const dp2 = fmtPlace(ev.place2);
      const cls1 = dp1 === '#1' ? 'placement-badge p1 place-1' : 'placement-badge p1';
      const cls2 = dp2 === '#1' ? 'placement-badge p2 place-1' : 'placement-badge p2';
      h += `<div class="shared-event-row">
        <div>
          <div class="shared-event-name">${nm}</div>
          ${yearStr ? `<div class="shared-event-year">${yearStr}</div>` : ''}
        </div>
        <div class="shared-placements">
          <span class="${cls1}">${dp1}</span>
        </div>
        <div class="shared-placements">
          <span class="${cls2}">${dp2}</span>
        </div>
      </div>`;
    });
    h += `</div>`;
  }
  h += `</div>`;

  h += `</div>`;

  document.getElementById('compareResults').innerHTML = h;

  if (hasChart) drawCompareChart(p1, p2);
}

// ── SHARED EVENTS MATCHING ────────────────────────────────
function findSharedEvents(events1, events2) {
  const normalize = name => name.toLowerCase().replace(/[^a-z0-9]/g, ' ').replace(/\s+/g, ' ').trim();
  const map2 = new Map();
  events2.forEach(e => {
    const key = normalize(e.name);
    if (!map2.has(key)) map2.set(key, e);
  });
  const shared = [];
  const seen = new Set();
  events1.forEach(e => {
    const key = normalize(e.name);
    if (map2.has(key) && !seen.has(key)) {
      seen.add(key);
      const e2 = map2.get(key);
      shared.push({ name: e.name, date: e.date || e2.date, link: e.link || e2.link, place1: e.place, place2: e2.place });
    }
  });
  // Sort by date descending
  shared.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  return shared;
}

function fmtPlace(p) {
  const s = String(p || '').replace(/^#/, '').trim();
  if (!s || s === '—') return '—';
  if (/^(DNF|DNS|DQ|WD|CUT)$/i.test(s)) return s.toUpperCase();
  return '#' + s;
}

function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── DUAL RATING CHART ─────────────────────────────────────
function drawCompareChart(p1, p2) {
  const canvas = document.getElementById('compareChart');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const wrap = canvas.parentElement;
  canvas.width = wrap.clientWidth;
  canvas.height = wrap.clientHeight;
  const W = canvas.width, H = canvas.height;
  const pad = { top: 28, right: 16, bottom: 16, left: 44 };
  const chartW = W - pad.left - pad.right;
  const chartH = H - pad.top - pad.bottom;

  const h1 = p1.ratingHistory, h2 = p2.ratingHistory;

  // Build unified date axis
  const allDates = Array.from(new Set([...h1.map(d=>d.date), ...h2.map(d=>d.date)])).sort();
  if (allDates.length < 2) return;

  // For each player, get rating at each date (last known value)
  function ratingAt(history, date) {
    if (!history.length) return null;
    let last = null;
    for (const e of history) {
      if (e.date <= date) last = e.rating;
      else break;
    }
    return last;
  }

  const series1 = allDates.map(d => ({ date: d, rating: ratingAt(h1, d) })).filter(d => d.rating !== null);
  const series2 = allDates.map(d => ({ date: d, rating: ratingAt(h2, d) })).filter(d => d.rating !== null);

  const allRatings = [...series1.map(d=>d.rating), ...series2.map(d=>d.rating)].filter(Boolean);
  if (!allRatings.length) return;

  const minR = Math.min(...allRatings) - 20;
  const maxR = Math.max(...allRatings) + 20;
  const rRange = maxR - minR;

  // Map date string to X position
  const minDate = allDates[0], maxDate = allDates[allDates.length - 1];
  const minT = new Date(minDate).getTime(), maxT = new Date(maxDate).getTime();
  const spanT = maxT - minT || 1;

  const toX = date => pad.left + ((new Date(date).getTime() - minT) / spanT) * chartW;
  const toY = r => pad.top + chartH - ((r - minR) / rRange) * chartH;

  // Grid
  const step = rRange > 100 ? 50 : 25;
  for (let r = Math.ceil(minR / step) * step; r <= maxR; r += step) {
    const y = toY(r);
    ctx.beginPath();
    ctx.moveTo(pad.left, y);
    ctx.lineTo(pad.left + chartW, y);
    ctx.strokeStyle = 'rgba(180,180,200,0.5)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = '#a0a0b0';
    ctx.font = '10px DM Mono, monospace';
    ctx.textAlign = 'right';
    ctx.fillText(r, pad.left - 6, y + 3);
  }

  function drawSeries(series, color, alpha) {
    if (series.length < 2) return;
    // Gradient fill
    const grad = ctx.createLinearGradient(0, pad.top, 0, pad.top + chartH);
    grad.addColorStop(0, color.replace(')', `,${alpha})`).replace('rgb', 'rgba'));
    grad.addColorStop(1, color.replace(')', ',0)').replace('rgb', 'rgba'));
    ctx.beginPath();
    series.forEach((d, i) => { i === 0 ? ctx.moveTo(toX(d.date), toY(d.rating)) : ctx.lineTo(toX(d.date), toY(d.rating)); });
    ctx.lineTo(toX(series[series.length-1].date), pad.top + chartH);
    ctx.lineTo(toX(series[0].date), pad.top + chartH);
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();
    // Line
    ctx.beginPath();
    series.forEach((d, i) => { i === 0 ? ctx.moveTo(toX(d.date), toY(d.rating)) : ctx.lineTo(toX(d.date), toY(d.rating)); });
    ctx.strokeStyle = color;
    ctx.lineWidth = 2.5;
    ctx.lineJoin = 'round';
    ctx.stroke();
    // Dots
    series.forEach(d => {
      const x = toX(d.date), y = toY(d.rating);
      ctx.beginPath(); ctx.arc(x, y, 3.5, 0, Math.PI*2); ctx.fillStyle = color; ctx.fill();
      ctx.beginPath(); ctx.arc(x, y, 2, 0, Math.PI*2); ctx.fillStyle = '#fff'; ctx.fill();
    });
  }

  drawSeries(series1, 'rgb(197,0,122)', 0.15);
  drawSeries(series2, 'rgb(0,144,154)', 0.15);

  // Legend
  const legendEl = document.getElementById('chartLegend');
  if (legendEl) {
    legendEl.innerHTML = `
      <div class="chart-legend-item">
        <div class="chart-legend-dot" style="background:#c5007a;"></div>
        <span>${escHtml(p1.name)}</span>
      </div>
      <div class="chart-legend-item">
        <div class="chart-legend-dot" style="background:#00909a;"></div>
        <span>${escHtml(p2.name)}</span>
      </div>`;
  }

  // Tooltip
  let tip = wrap.querySelector('.chart-tip');
  if (!tip) {
    tip = document.createElement('div');
    tip.className = 'chart-tip';
    tip.style.cssText = 'position:absolute;pointer-events:none;display:none;background:#fff;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,0.12);padding:7px 13px;white-space:nowrap;z-index:10;font-size:12px;';
    wrap.appendChild(tip);
  }

  canvas.onmousemove = e => {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const mx = (e.clientX - rect.left) * scaleX;
    // Find closest date across both series
    let closest = null, minDist = Infinity;
    [...series1, ...series2].forEach(d => {
      const dx = Math.abs(toX(d.date) - mx);
      if (dx < minDist) { minDist = dx; closest = d.date; }
    });
    if (!closest) return;

    const r1 = ratingAt(h1, closest);
    const r2 = ratingAt(h2, closest);
    const dateStr = new Date(closest + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', year: 'numeric' });

    // Redraw
    ctx.clearRect(0, 0, W, H);
    // Redraw grid
    for (let r = Math.ceil(minR / step) * step; r <= maxR; r += step) {
      const y = toY(r);
      ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(pad.left + chartW, y);
      ctx.strokeStyle = 'rgba(180,180,200,0.5)'; ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = '#a0a0b0'; ctx.font = '10px DM Mono, monospace'; ctx.textAlign = 'right';
      ctx.fillText(r, pad.left - 6, y + 3);
    }
    drawSeries(series1, 'rgb(197,0,122)', 0.15);
    drawSeries(series2, 'rgb(0,144,154)', 0.15);
    // Highlight dots
    if (r1) { const x = toX(closest), y = toY(r1); ctx.beginPath(); ctx.arc(x, y, 5.5, 0, Math.PI*2); ctx.fillStyle = '#c5007a'; ctx.fill(); ctx.beginPath(); ctx.arc(x, y, 2.5, 0, Math.PI*2); ctx.fillStyle = '#fff'; ctx.fill(); }
    if (r2) { const x = toX(closest), y = toY(r2); ctx.beginPath(); ctx.arc(x, y, 5.5, 0, Math.PI*2); ctx.fillStyle = '#00909a'; ctx.fill(); ctx.beginPath(); ctx.arc(x, y, 2.5, 0, Math.PI*2); ctx.fillStyle = '#fff'; ctx.fill(); }

    let tipHtml = `<span style="color:#888;margin-right:8px;">${dateStr}</span>`;
    if (r1) tipHtml += `<span style="color:#c5007a;font-weight:700;font-family:'DM Mono',monospace;margin-right:8px;">${r1}</span>`;
    if (r2) tipHtml += `<span style="color:#00909a;font-weight:700;font-family:'DM Mono',monospace;">${r2}</span>`;
    tip.innerHTML = tipHtml;
    tip.style.display = 'block';

    const scaleY = canvas.height / rect.height;
    const px = toX(closest) / scaleX;
    let left = px - tip.offsetWidth / 2;
    if (left < 4) left = 4;
    if (left + tip.offsetWidth > wrap.clientWidth - 4) left = wrap.clientWidth - tip.offsetWidth - 4;
    tip.style.left = left + 'px';
    tip.style.top = '6px';
  };

  canvas.onmouseleave = () => {
    tip.style.display = 'none';
    ctx.clearRect(0, 0, W, H);
    for (let r = Math.ceil(minR / step) * step; r <= maxR; r += step) {
      const y = toY(r);
      ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(pad.left + chartW, y);
      ctx.strokeStyle = 'rgba(180,180,200,0.5)'; ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = '#a0a0b0'; ctx.font = '10px DM Mono, monospace'; ctx.textAlign = 'right';
      ctx.fillText(r, pad.left - 6, y + 3);
    }
    drawSeries(series1, 'rgb(197,0,122)', 0.15);
    drawSeries(series2, 'rgb(0,144,154)', 0.15);
  };
}

// ── NAV ───────────────────────────────────────────────────
function toggleNav() {
  document.getElementById('navDropdown').classList.toggle('open');
}
document.addEventListener('click', e => {
  const menu = document.getElementById('navMenu');
  if (menu && !menu.contains(e.target)) document.getElementById('navDropdown').classList.remove('open');
});

// ── KEYBOARD ──────────────────────────────────────────────
document.getElementById('p1Input').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('p2Input').focus(); });
document.getElementById('p2Input').addEventListener('keydown', e => { if (e.key === 'Enter') handleCompare(); });

// ── URL PARAMS (optional deep linking) ───────────────────
window.addEventListener('load', () => {
  const params = new URLSearchParams(location.search);
  const p1 = params.get('p1'), p2 = params.get('p2');
  if (p1) document.getElementById('p1Input').value = p1;
  if (p2) document.getElementById('p2Input').value = p2;
  if (p1 && p2) handleCompare();
});
