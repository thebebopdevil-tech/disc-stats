<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f2f3f7;
  --surface: #ffffff;
  --surface2: #f7f7fb;
  --border: #e4e4ec;
  --accent: #c5007a;
  --accent-light: #fce8f3;
  --accent-dark: #9a005f;
  --text: #18181f;
  --text-muted: #68687a;
  --text-dim: #a8a8bc;
  --shadow-sm: 0 1px 3px rgba(20,20,40,0.07);
  --shadow: 0 3px 14px rgba(20,20,40,0.09), 0 1px 3px rgba(20,20,40,0.05);
  --radius: 14px;
  --radius-sm: 10px;
  --radius-pill: 999px;
}
body { background: var(--bg); font-family: 'DM Sans', sans-serif; min-height: 100vh; color: var(--text); overflow-x: hidden; }
.app { max-width: 900px; margin: 0 auto; padding: 32px 16px 52px; }

/* HEADER */
header { display: flex; align-items: center; gap: 13px; margin-bottom: 28px; }
.logo { width: 46px; height: 46px; border-radius: 12px; flex-shrink: 0; overflow: hidden; box-shadow: 0 2px 8px rgba(197,0,122,0.3); }
.logo img { width: 46px; height: 46px; display: block; }
.header-text h1 { font-size: 21px; font-weight: 800; color: var(--text); letter-spacing: -0.5px; }
.header-text p { font-size: 12px; color: var(--text-muted); margin-top: 1px; font-weight: 400; }

/* NAV */
.nav-menu { margin-left: auto; position: relative; }
.nav-trigger {
  display: flex; align-items: center; gap: 7px;
  background: var(--surface); border: 1.5px solid var(--border);
  border-radius: var(--radius-pill); padding: 8px 14px;
  font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 700;
  color: var(--text); cursor: pointer; box-shadow: var(--shadow-sm);
  white-space: nowrap; transition: border-color 0.15s, color 0.15s;
}
.nav-trigger:hover { border-color: var(--accent); color: var(--accent); }
.nav-dropdown {
  display: none; position: absolute; top: calc(100% + 8px); right: 0;
  background: var(--surface); border: 1.5px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow);
  min-width: 160px; z-index: 100; overflow: hidden;
}
.nav-dropdown.open { display: block; }
.nav-item {
  display: flex; align-items: center; gap: 9px; padding: 12px 16px;
  font-size: 13.5px; font-weight: 600; color: var(--text-muted);
  cursor: pointer; transition: background 0.12s, color 0.12s;
  border-bottom: 1px solid var(--border); text-decoration: none;
}
.nav-item:last-child { border-bottom: none; }
.nav-item:hover { background: var(--surface2); color: var(--text); }
.nav-item.nav-item-active { color: var(--accent); }
.nav-item.nav-item-active svg { color: var(--accent); }

/* SEARCH BAR */
.search-bar { display: flex; gap: 8px; margin-bottom: 14px; }
.search-bar input {
  flex: 1; background: var(--surface); border: 1.5px solid var(--border);
  border-radius: var(--radius-pill); padding: 11px 20px;
  color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px;
  outline: none; transition: border-color 0.15s, box-shadow 0.15s; box-shadow: var(--shadow-sm);
}
.search-bar input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(197,0,122,0.1); }
.search-bar input::placeholder { color: var(--text-dim); }
.btn-secondary {
  background: var(--surface); color: var(--text); border: 1.5px solid var(--border);
  border-radius: var(--radius-pill); padding: 10px 18px;
  font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 13px;
  cursor: pointer; white-space: nowrap; flex-shrink: 0; box-shadow: var(--shadow-sm);
  transition: border-color 0.15s, color 0.15s;
}
.btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
.btn-secondary:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary {
  background: var(--accent); color: #fff; border: none;
  border-radius: var(--radius-pill); padding: 11px 26px;
  font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 14px;
  cursor: pointer; white-space: nowrap; flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(197,0,122,0.25);
  transition: background 0.15s, box-shadow 0.15s, transform 0.1s;
}
.btn-primary:hover { background: var(--accent-dark); box-shadow: 0 3px 12px rgba(197,0,122,0.35); }
.btn-primary:active { transform: scale(0.97); }
.btn-primary:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; }

/* TIER FILTERS */
.tier-filters { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 14px; }
.tier-btn {
  background: var(--surface); border: 1.5px solid var(--border);
  border-radius: var(--radius-pill); padding: 6px 16px;
  font-family: 'DM Sans', sans-serif; font-size: 12.5px; font-weight: 600;
  color: var(--text-muted); cursor: pointer; box-shadow: var(--shadow-sm);
  transition: background 0.12s, border-color 0.12s, color 0.12s;
}
.tier-btn:hover { border-color: var(--accent); color: var(--accent); }
.tier-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 2px 8px rgba(197,0,122,0.25); }

/* MAP */
#mapContainer {
  width: 100%; height: 440px; border-radius: var(--radius); overflow: hidden;
  border: 1.5px solid var(--border); box-shadow: var(--shadow);
  margin-bottom: 14px; background: var(--surface2);
  display: flex; align-items: center; justify-content: center;
}
#map { width: 100%; height: 100%; }
.map-placeholder { display: flex; flex-direction: column; align-items: center; gap: 10px; color: var(--text-muted); font-size: 14px; text-align: center; }

/* SECTION HEADER */
.section-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
.section-header h3 { font-size: 14px; font-weight: 700; color: var(--text); letter-spacing: -0.2px; }
#eventCount { font-size: 12px; color: var(--text-dim); margin-left: auto; font-family: 'DM Mono', monospace; }

/* EVENT CARDS */
.event-card {
  background: var(--surface); border: 1.5px solid var(--border);
  border-radius: var(--radius-sm); padding: 14px 16px; margin-bottom: 8px;
  box-shadow: var(--shadow-sm); display: grid;
  grid-template-columns: auto 1fr auto; gap: 10px 14px; align-items: start;
  cursor: pointer; transition: border-color 0.15s, box-shadow 0.15s;
}
.event-card:hover { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(197,0,122,0.06), var(--shadow-sm); }
.event-card.hidden { display: none; }
.tier-badge {
  font-family: 'DM Mono', monospace; font-size: 10.5px; font-weight: 600;
  padding: 3px 8px; border-radius: var(--radius-pill); white-space: nowrap;
  background: var(--surface2); border: 1px solid var(--border); color: var(--text-muted);
  margin-top: 1px;
}
.tier-b  { background: #e8efff; color: #2244aa; border-color: #b8ccf8; }
.tier-a  { background: #fff3e0; color: #b84800; border-color: #f5c9a0; }
.tier-major { background: var(--accent-light); color: var(--accent); border-color: #f0a0d0; }
.event-name { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 5px; line-height: 1.3; }
.event-name a { color: inherit; text-decoration: none; }
.event-name a:hover { color: var(--accent); text-decoration: underline; }
.event-meta { font-size: 12px; color: var(--text-muted); display: flex; flex-wrap: wrap; gap: 10px; }
.event-meta span { display: flex; align-items: center; gap: 4px; }
.event-dist { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text-dim); text-align: right; white-space: nowrap; margin-top: 2px; }

/* STATUS */
.status { text-align: center; padding: 52px 24px; color: var(--text-muted); font-size: 14px; line-height: 1.8; background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow-sm); }
.status.error { color: #c0392b; }
.spinner { width: 28px; height: 28px; border: 2.5px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 14px; }
@keyframes spin { to { transform: rotate(360deg); } }
.pdga-credit { text-align: center; font-size: 11px; color: var(--text-dim); margin-top: 28px; }
.pdga-credit a { color: var(--accent); text-decoration: none; }

@media (max-width: 500px) {
  #mapContainer { height: 300px; }
  .search-bar { flex-wrap: wrap; }
  .btn-secondary { flex: 1; text-align: center; justify-content: center; }
}
</style>
</head>

<script>
const PROXY = 'https://disc-stats.vercel.app/api/proxy';
const RADIUS_KM = 500;

let map, geocoder, userMarker, allMarkers = [], allEvents = [], activeTier = 'all';
let openInfoWindow = null;

window.onMapsLoaded = function() {
  geocoder = new google.maps.Geocoder();
  document.getElementById('locationInput').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
};

window.gm_authFailure = function() {
  document.getElementById('mapContainer').innerHTML = '<div class="map-placeholder" style="color:#c0392b;padding:20px;">Google Maps could not load — check API key configuration.</div>';
};

function initMapEl() {
  if (map) return;
  const el = document.getElementById('mapContainer');
  el.innerHTML = '<div id="map" style="width:100%;height:100%;"></div>';
  map = new google.maps.Map(document.getElementById('map'), {
    center: { lat: 30, lng: 10 }, zoom: 2,
    mapTypeControl: false, streetViewControl: false, fullscreenControl: false,
    styles: [{ featureType: 'poi', stylers: [{ visibility: 'off' }] }, { featureType: 'transit', stylers: [{ visibility: 'off' }] }],
  });
  map.addListener('click', () => { if (openInfoWindow) { openInfoWindow.close(); openInfoWindow = null; } });
}

function toggleNav() { document.getElementById('navDropdown').classList.toggle('open'); }
document.addEventListener('click', e => {
  const m = document.getElementById('navMenu');
  if (m && !m.contains(e.target)) document.getElementById('navDropdown').classList.remove('open');
});

async function doSearch() {
  const input = document.getElementById('locationInput').value.trim();
  if (!input) return;
  if (!geocoder) { alert('Maps API still loading, please wait.'); return; }
  setBtnsLoading(true);
  geocoder.geocode({ address: input }, async (results, status) => {
    if (status !== 'OK' || !results[0]) {
      setBtnsLoading(false);
      showStatus('Location not found. Try a different city or country.', true);
      return;
    }
    const loc = results[0].geometry.location;
    await loadEvents(loc.lat(), loc.lng());
    setBtnsLoading(false);
  });
}

async function nearMe() {
  if (!navigator.geolocation) { showStatus('Geolocation not supported.', true); return; }
  const btn = document.getElementById('nearMeBtn');
  btn.disabled = true; btn.textContent = '📍 Locating…';
  navigator.geolocation.getCurrentPosition(
    async pos => {
      const { latitude: lat, longitude: lng } = pos.coords;
      if (geocoder) {
        geocoder.geocode({ location: { lat, lng } }, (res, st) => {
          if (st === 'OK' && res[0]) {
            const city = res[0].address_components.find(c => c.types.includes('locality'));
            const country = res[0].address_components.find(c => c.types.includes('country'));
            document.getElementById('locationInput').value = [city?.long_name, country?.long_name].filter(Boolean).join(', ');
          }
        });
      }
      await loadEvents(lat, lng);
      btn.disabled = false; btn.textContent = '📍 Near me';
    },
    err => {
      btn.disabled = false; btn.textContent = '📍 Near me';
      showStatus('Could not get your location: ' + err.message, true);
    }
  );
}

function setBtnsLoading(on) {
  const s = document.getElementById('searchBtn');
  const n = document.getElementById('nearMeBtn');
  s.disabled = on; s.textContent = on ? 'Searching…' : 'Search';
  n.disabled = on;
}

async function loadEvents(lat, lng) {
  initMapEl();
  showLoading();
  clearMarkers();

  if (userMarker) userMarker.setMap(null);
  userMarker = new google.maps.Marker({
    position: { lat, lng }, map,
    icon: { path: google.maps.SymbolPath.CIRCLE, scale: 9, fillColor: '#c5007a', fillOpacity: 1, strokeColor: '#fff', strokeWeight: 2.5 },
    zIndex: 999, title: 'Your location',
  });
  map.setCenter({ lat, lng });
  map.setZoom(7);

  try {
    const today = new Date();
    const end = new Date(); end.setDate(end.getDate() + 60);
    const fmt = d => `${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}/${d.getFullYear()}`;
    const pdgaUrl = `https://www.pdga.com/events?date[min][date]=${fmt(today)}&date[max][date]=${fmt(end)}`;
    const res = await fetch(`${PROXY}?url=${encodeURIComponent(pdgaUrl)}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const html = await res.text();

    allEvents = parsePDGAEvents(html);
    if (!allEvents.length) { showStatus('No upcoming events found. Try again later.'); return; }

    document.getElementById('listHeader').style.display = 'flex';
    renderList();
    geocodeEvents(lat, lng); // background: adds markers + distances, re-renders
  } catch(err) {
    showStatus('Failed to load events: ' + err.message, true);
  }
}

function parsePDGAEvents(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const table = doc.querySelector('table');
  if (!table) return [];

  const headers = [...table.querySelectorAll('thead th')].map(th => th.textContent.trim().toLowerCase());
  const col = (...names) => names.reduce((found, n) => found !== -1 ? found : headers.findIndex(h => h.includes(n)), -1);

  const nameCol    = col('tournament', 'event', 'name');
  const startCol   = col('start date', 'start', 'date');
  const endCol     = col('end date', 'end');
  const tierCol    = col('tier', 'class');
  const cityCol    = col('city', 'location');
  const stateCol   = col('state', 'province');
  const countryCol = col('country');

  return [...table.querySelectorAll('tbody tr')].map(tr => {
    const cells = [...tr.querySelectorAll('td')];
    if (!cells.length) return null;
    const nameCell = cells[nameCol >= 0 ? nameCol : 0];
    const anchor = nameCell?.querySelector('a');
    const name = (anchor || nameCell)?.textContent.trim();
    if (!name) return null;

    const link = anchor ? 'https://www.pdga.com' + anchor.getAttribute('href').split('#')[0] : '';
    const startDate = startCol >= 0 ? cells[startCol]?.textContent.trim() : '';
    const endDate   = endCol >= 0   ? cells[endCol]?.textContent.trim()   : '';
    let dates = '';
    if (startDate && endDate && startDate !== endDate) dates = `${fmtDate(startDate)} – ${fmtDate(endDate)}`;
    else if (startDate) dates = fmtDate(startDate);

    const rawTier = tierCol >= 0    ? cells[tierCol]?.textContent.trim()    : '';
    const city    = cityCol >= 0    ? cells[cityCol]?.textContent.trim()    : '';
    const state   = stateCol >= 0   ? cells[stateCol]?.textContent.trim()   : '';
    const country = countryCol >= 0 ? cells[countryCol]?.textContent.trim() : '';
    const location = [city, state, country].filter(Boolean).join(', ');

    return { name, link, dates, tier: normTier(rawTier), location, lat: null, lng: null, dist: null };
  }).filter(Boolean);
}

async function geocodeEvents(userLat, userLng) {
  if (!geocoder || !allEvents.length) return;
  const BATCH = 4, DELAY = 180;
  for (let i = 0; i < allEvents.length; i += BATCH) {
    const batch = allEvents.slice(i, i + BATCH);
    await Promise.all(batch.map(e => new Promise(resolve => {
      if (!e.location) { resolve(); return; }
      geocoder.geocode({ address: e.location }, (res, st) => {
        if (st === 'OK' && res[0]) {
          e.lat = res[0].geometry.location.lat();
          e.lng = res[0].geometry.location.lng();
          e.dist = haversine(userLat, userLng, e.lat, e.lng);
          addMarker(e);
        }
        resolve();
      });
    })));
    if (i + BATCH < allEvents.length) await new Promise(r => setTimeout(r, DELAY));
  }
  allEvents.sort((a, b) => (a.dist ?? Infinity) - (b.dist ?? Infinity));
  renderList();
}

function haversine(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLng/2)**2;
  return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
}

function fmtDate(s) {
  if (!s) return '';
  // Accepts "YYYY-MM-DD" or "MM/DD/YYYY"
  const d = new Date(s.includes('T') ? s : s + 'T00:00:00');
  if (isNaN(d)) return s;
  return d.toLocaleDateString('en-SE', { day: 'numeric', month: 'short', year: 'numeric' });
}

function normTier(t) {
  t = (t || '').trim();
  if (/^C$/i.test(t)) return 'C';
  if (/^B$/i.test(t)) return 'B';
  if (/^A$/i.test(t)) return 'A';
  if (/^(ES|Elite Series|Elite|NT|National Tour|M|Major|XA|XB|XC|XM|H|W|Pro)/i.test(t)) return 'Major';
  return t || '—';
}

function tierCls(tier) {
  return { C:'', B:'tier-b', A:'tier-a', Major:'tier-major' }[tier] || '';
}

function tierColor(tier) {
  return { A:'#d96000', B:'#2255cc', Major:'#c5007a', C:'#888' }[tier] || '#888';
}

function renderList() {
  const filtered = activeTier === 'all' ? allEvents : allEvents.filter(e => e.tier === activeTier);
  document.getElementById('eventCount').textContent = filtered.length + ' events';
  if (!filtered.length) {
    document.getElementById('eventsList').innerHTML = '<div class="status">No events for this tier filter.</div>';
    return;
  }
  document.getElementById('eventsList').innerHTML = filtered.map(e => {
    const nm = e.link ? `<a href="${e.link}" target="_blank">${escHtml(e.name)}</a>` : escHtml(e.name);
    return `<div class="event-card" data-tier="${e.tier}">
      <div class="tier-badge ${tierCls(e.tier)}">${e.tier}</div>
      <div>
        <div class="event-name">${nm}</div>
        <div class="event-meta">
          ${e.dates ? `<span>📅 ${escHtml(e.dates)}</span>` : ''}
          ${e.location ? `<span>📍 ${escHtml(e.location)}</span>` : ''}
          ${e.dist != null ? `<span>${e.dist} km away</span>` : ''}
        </div>
      </div>
      <div></div>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function addMarker(e) {
  if (!map || e.lat == null || e.lng == null) return;

  const marker = new google.maps.Marker({
    position: { lat: e.lat, lng: e.lng }, map, title: e.name,
    icon: {
      path: google.maps.SymbolPath.CIRCLE,
      scale: 7, fillColor: tierColor(e.tier), fillOpacity: 0.88,
      strokeColor: '#ffffff', strokeWeight: 1.5,
    },
  });

  const content = `<div style="font-family:'DM Sans',sans-serif;max-width:230px;padding:2px 0;">
    <div style="font-weight:700;font-size:13px;line-height:1.35;margin-bottom:5px;">${escHtml(e.name)}</div>
    ${e.dates ? `<div style="font-size:12px;color:#555;margin-bottom:2px;">📅 ${escHtml(e.dates)}</div>` : ''}
    ${e.location ? `<div style="font-size:12px;color:#555;margin-bottom:2px;">📍 ${escHtml(e.location)}</div>` : ''}
    <div style="font-size:11px;color:#777;margin-bottom:6px;">Tier ${escHtml(e.tier)}</div>
    ${e.link ? `<a href="${e.link}" target="_blank" style="font-size:12.5px;color:#c5007a;font-weight:700;text-decoration:none;">View on PDGA →</a>` : ''}
  </div>`;

  const iw = new google.maps.InfoWindow({ content });
  marker.addListener('click', () => {
    if (openInfoWindow) openInfoWindow.close();
    iw.open(map, marker); openInfoWindow = iw;
  });
  marker._event = e;
  allMarkers.push(marker);
}

function clearMarkers() {
  allMarkers.forEach(m => m.setMap(null));
  allMarkers = [];
  if (openInfoWindow) { openInfoWindow.close(); openInfoWindow = null; }
}

function setTier(tier) {
  activeTier = tier;
  document.querySelectorAll('.tier-btn').forEach(b => b.classList.toggle('active', b.dataset.tier === tier));
  allMarkers.forEach(m => { m.setMap((tier === 'all' || m._event?.tier === tier) ? map : null); });
  if (allEvents.length) renderList();
}

function showLoading() {
  document.getElementById('listHeader').style.display = 'none';
  document.getElementById('eventsList').innerHTML = '<div class="status"><div class="spinner"></div>Loading events…</div>';
}

function showStatus(msg, err) {
  document.getElementById('listHeader').style.display = 'none';
  document.getElementById('eventsList').innerHTML = `<div class="status${err ? ' error' : ''}">${msg}</div>`;
}
</script>
</body>
</html>
